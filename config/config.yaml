app:
  env: production
  timezone: Europe/Madrid
  dry_run: false

logging:
  level: info
  format: json

draft:
  year: 2026
  espn_url: https://site.api.espn.com/apis/site/v2/sports/football/nfl/draft
  miami_team_id: "15"
  miami_team_abbr: MIA
  miami_display_name: Miami Dolphins
  original_miami_picks: [11, 30, 43, 75, 87, 90, 94, 130, 151, 227, 238]

windows:
  - name: round1
    start: "2026-04-24T02:00:00"
    rounds: [1]
  - name: rounds2_3
    start: "2026-04-25T01:00:00"
    rounds: [2, 3]
  - name: rounds4_7
    start: "2026-04-25T18:00:00"
    rounds: [4, 5, 6, 7]

polling:
  round_intervals:
    "1": 60s
    "2": 45s
    "3": 30s
    "4": 30s
    "5": 30s
    "6": 30s
    "7": 25s

http:
  timeout: 10s
  retries: 3
  backoff: 2s

storage:
  kind: json
  path: ./data/state.json
